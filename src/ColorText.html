<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-Bit Text Colorizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f, #d63384);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            padding: 40px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .control-label {
            font-size: 1.1em;
            font-weight: 600;
            color: #495057;
            margin-bottom: 10px;
            display: block;
        }

        #textInput {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 120px;
            transition: all 0.3s ease;
            background: white;
            margin-bottom: 20px;
        }

        #textInput:focus {
            outline: none;
            border-color: #6f42c1;
            box-shadow: 0 0 0 4px rgba(111, 66, 193, 0.1);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .control-group {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-value {
            background: #6f42c1;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 50px;
            text-align: center;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #6f42c1, #5a359a);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(111, 66, 193, 0.3);
        }

        .output-section {
            padding: 40px;
            background: white;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .output-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #495057;
        }

        .copy-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .colorized-output {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 30px;
            font-family: 'Courier New', monospace;
            line-height: 1.8;
            font-size: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
            min-height: 200px;
        }

        .colorized-char {
            position: relative;
            transition: all 0.2s ease;
        }

        .colorized-char:hover {
            transform: scale(1.2);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .color-info {
            background: #495057;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        .colorized-char:hover .color-info {
            opacity: 1;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #6f42c1;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .color-swatch:hover {
            transform: scale(1.3);
        }

        .empty-state {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 60px 20px;
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .rainbow-animation {
            animation: rainbow 3s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>32-Bit Text Colorizer</h1>
            <p>Transform your text into a vibrant rainbow of colors with 32-bit precision</p>
        </div>

        <div class="controls">
            <label class="control-label" for="textInput">Enter Your Text:</label>
            <textarea id="textInput" placeholder="Type or paste your text here... Each character will get a unique color!">Hello World! This is a demonstration of 32-bit color text colorization. Each character receives a unique color based on its position and ASCII value.</textarea>

            <div class="controls-grid">
                <div class="control-group">
                    <label class="control-label" for="colorMode">Color Generation Mode:</label>
                    <select id="colorMode">
                        <option value="position">Position-based</option>
                        <option value="ascii">ASCII-based</option>
                        <option value="rainbow">Rainbow Gradient</option>
                        <option value="random">Random Colors</option>
                        <option value="hash">Hash-based</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label" for="saturation">Color Saturation:</label>
                    <div class="range-container">
                        <input type="range" id="saturation" min="30" max="100" value="80">
                        <span class="range-value" id="saturationValue">80%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label" for="lightness">Color Lightness:</label>
                    <div class="range-container">
                        <input type="range" id="lightness" min="30" max="80" value="50">
                        <span class="range-value" id="lightnessValue">50%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label" for="hueShift">Hue Shift:</label>
                    <div class="range-container">
                        <input type="range" id="hueShift" min="0" max="360" value="0">
                        <span class="range-value" id="hueShiftValue">0°</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label" for="fontSize">Font Size:</label>
                    <div class="range-container">
                        <input type="range" id="fontSize" min="12" max="36" value="18">
                        <span class="range-value" id="fontSizeValue">18px</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Options:</label>
                    <div class="checkbox-container">
                        <input type="checkbox" id="smoothTransition" checked>
                        <label for="smoothTransition">Smooth Transitions</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="showTooltips" checked>
                        <label for="showTooltips">Show Color Info</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="rainbowAnimation">
                        <label for="rainbowAnimation">Rainbow Animation</label>
                    </div>
                </div>
            </div>

            <button class="btn" onclick="colorizeText()">🎨 Colorize Text</button>
        </div>

        <div class="output-section">
            <div class="output-header">
                <h2 class="output-title">Colorized Output</h2>
                <button class="copy-btn" onclick="copyToClipboard()">📋 Copy HTML</button>
            </div>

            <div class="colorized-output" id="colorizedOutput">
                <div class="empty-state">
                    Your colorized text will appear here...
                </div>
            </div>

            <div class="stats" id="statsContainer" style="display: none;">
                <div class="stat-item">
                    <span class="stat-value" id="charCount">0</span>
                    <span class="stat-label">Characters</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="uniqueColors">0</span>
                    <span class="stat-label">Unique Colors</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="colorDepth">32</span>
                    <span class="stat-label">Bit Depth</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="colorSpace">16.7M</span>
                    <span class="stat-label">Total Colors</span>
                </div>
            </div>

            <div class="color-palette" id="colorPalette" style="display: none;"></div>
        </div>
    </div>

    <script>
        function updateRangeValues() {
            document.getElementById('saturationValue').textContent = document.getElementById('saturation').value + '%';
            document.getElementById('lightnessValue').textContent = document.getElementById('lightness').value + '%';
            document.getElementById('hueShiftValue').textContent = document.getElementById('hueShift').value + '°';
            document.getElementById('fontSizeValue').textContent = document.getElementById('fontSize').value + 'px';
        }

        // Event listeners
        document.getElementById('saturation').addEventListener('input', updateRangeValues);
        document.getElementById('lightness').addEventListener('input', updateRangeValues);
        document.getElementById('hueShift').addEventListener('input', updateRangeValues);
        document.getElementById('fontSize').addEventListener('input', updateRangeValues);

        document.getElementById('textInput').addEventListener('input', () => {
            if (document.getElementById('textInput').value.trim()) {
                colorizeText();
            }
        });

        document.querySelectorAll('select, input[type="range"], input[type="checkbox"]').forEach(control => {
            control.addEventListener('change', () => {
                if (document.getElementById('textInput').value.trim()) {
                    colorizeText();
                }
            });
        });

        function generateColor(index, char, mode, totalLength) {
            const saturation = document.getElementById('saturation').value;
            const lightness = document.getElementById('lightness').value;
            const hueShift = parseInt(document.getElementById('hueShift').value);
            
            let hue = 0;
            
            switch (mode) {
                case 'position':
                    hue = (index / totalLength) * 360;
                    break;
                case 'ascii':
                    hue = (char.charCodeAt(0) * 137.508) % 360; // Golden angle
                    break;
                case 'rainbow':
                    hue = (index / totalLength) * 360;
                    break;
                case 'random':
                    hue = ((char.charCodeAt(0) * index * 137.508) % 360);
                    break;
                case 'hash':
                    let hash = 0;
                    const str = char + index;
                    for (let i = 0; i < str.length; i++) {
                        hash = ((hash << 5) - hash + str.charCodeAt(i)) & 0xffffffff;
                    }
                    hue = Math.abs(hash) % 360;
                    break;
            }
            
            hue = (hue + hueShift) % 360;
            
            return {
                hsl: `hsl(${hue}, ${saturation}%, ${lightness}%)`,
                hex: hslToHex(hue, saturation, lightness),
                hue: Math.round(hue),
                saturation: saturation,
                lightness: lightness
            };
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function colorizeText() {
            const text = document.getElementById('textInput').value;
            const colorMode = document.getElementById('colorMode').value;
            const fontSize = document.getElementById('fontSize').value;
            const smoothTransition = document.getElementById('smoothTransition').checked;
            const showTooltips = document.getElementById('showTooltips').checked;
            const rainbowAnimation = document.getElementById('rainbowAnimation').checked;
            
            if (!text.trim()) {
                document.getElementById('colorizedOutput').innerHTML = '<div class="empty-state">Your colorized text will appear here...</div>';
                document.getElementById('statsContainer').style.display = 'none';
                document.getElementById('colorPalette').style.display = 'none';
                return;
            }

            const output = document.getElementById('colorizedOutput');
            output.innerHTML = '';
            output.style.fontSize = fontSize + 'px';
            
            if (rainbowAnimation) {
                output.classList.add('rainbow-animation');
            } else {
                output.classList.remove('rainbow-animation');
            }

            const uniqueColors = new Set();
            let html = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const color = generateColor(i, char, colorMode, text.length);
                uniqueColors.add(color.hex);

                const style = smoothTransition ? 
                    `color: ${color.hsl}; transition: all 0.3s ease;` : 
                    `color: ${color.hsl};`;

                const tooltip = showTooltips ? 
                    `<span class="color-info">Char: ${char === ' ' ? 'space' : char} | Color: ${color.hex} | HSL: ${color.hue}°, ${color.saturation}%, ${color.lightness}%</span>` : 
                    '';

                if (char === '\n') {
                    html += '<br>';
                } else {
                    html += `<span class="colorized-char" style="${style}">${char === ' ' ? '&nbsp;' : char}${tooltip}</span>`;
                }
            }

            output.innerHTML = html;

            // Update statistics
            document.getElementById('charCount').textContent = text.length;
            document.getElementById('uniqueColors').textContent = uniqueColors.size;
            document.getElementById('statsContainer').style.display = 'grid';

            // Create color palette
            createColorPalette(Array.from(uniqueColors));
        }

        function createColorPalette(colors) {
            const palette = document.getElementById('colorPalette');
            palette.innerHTML = '';
            
            colors.slice(0, 100).forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color;
                swatch.title = color;
                swatch.addEventListener('click', () => {
                    navigator.clipboard.writeText(color).then(() => {
                        swatch.style.transform = 'scale(1.5)';
                        setTimeout(() => {
                            swatch.style.transform = 'scale(1)';
                        }, 200);
                    });
                });
                palette.appendChild(swatch);
            });
            
            palette.style.display = 'flex';
        }

        function copyToClipboard() {
            const output = document.getElementById('colorizedOutput');
            const htmlContent = output.innerHTML;
            
            const fullHtml = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Colorized Text</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #f8f9fa; }
        .colorized-char { transition: all 0.2s ease; }
        .colorized-char:hover { transform: scale(1.1); }
    </style>
</head>
<body>
${htmlContent}
</body>
</html>`;

            navigator.clipboard.writeText(fullHtml).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                btn.style.background = 'linear-gradient(45deg, #28a745, #20c997)';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy to clipboard');
            });
        }

        // Initialize
        updateRangeValues();
        colorizeText();
    </script>
</body>
</html>
